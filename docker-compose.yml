services:
  postgres:
    image: postgres:16
    container_name: finance-manager-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: finance_manager
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - finance_manager_postgres_data:/var/lib/postgresql/data

volumes:
  finance_manager_postgres_data:
